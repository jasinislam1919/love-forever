<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lilium Orientalis — Jasin + Rafia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020205;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f4eef2;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 42%, #0a0912 0%, #030307 58%, #010102 100%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 52%, rgba(1, 1, 3, 0.78) 100%);
      z-index: 2;
    }

    .hud-header {
      position: fixed;
      top: 18px;
      left: 20px;
      z-index: 5;
      pointer-events: none;
      opacity: 0.85;
    }

    .hud-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 0.95rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #d8e8dc;
      font-weight: 500;
    }

    .hud-sub {
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      color: rgba(216, 232, 220, 0.52);
      margin-top: 3px;
      text-transform: uppercase;
    }

    .controls-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(14, 14, 22, 0.58);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.55);
    }

    .btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      color: #f3e8ee;
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      padding: 8px 15px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: rgba(255, 130, 175, 0.16);
      border-color: rgba(255, 130, 175, 0.45);
      color: #ffffff;
    }

    .btn.active {
      background: rgba(255, 105, 160, 0.24);
      border-color: rgba(255, 145, 185, 0.65);
      color: #ffe3ee;
    }

    .progress-pill {
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      color: rgba(235, 225, 232, 0.65);
      padding: 0 8px;
      min-width: 96px;
      text-align: center;
    }

    @media (max-width: 480px) {
      .hud-header {
        top: 14px;
        left: 14px;
      }
      .controls-bar {
        bottom: 16px;
        gap: 6px;
        padding: 5px 8px;
      }
      .btn {
        padding: 7px 12px;
        font-size: 0.72rem;
      }
      .progress-pill {
        min-width: 82px;
        font-size: 0.65rem;
      }
    }

    #loader{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#020205;color:#f4d6e2;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:1.3rem;letter-spacing:.12em;transition:opacity 1.4s ease;pointer-events:none}
    #loader.done{opacity:0}
    #loader span{animation:lp 1.6s ease-in-out infinite}
    @keyframes lp{0%,100%{opacity:.45;transform:scale(.98)}50%{opacity:1;transform:scale(1.03)}}
    .controls-bar{flex-wrap:wrap;justify-content:center;max-width:94vw}
    .btn{min-height:36px;touch-action:manipulation}
    .btn.pulse-hint{animation:lp 1.8s ease-in-out infinite}

    .controls-bar{left:0;right:0;bottom:0;transform:none;width:100%;max-width:none;padding:0 max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));background:none;border:none;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none;border-radius:0;justify-content:space-between;gap:8px;pointer-events:none;flex-wrap:nowrap}
    .controls-bar .btn{pointer-events:auto;flex-direction:column;justify-content:center;gap:3px;width:56px;height:56px;min-height:0;padding:0;border-radius:10px;background:rgba(14,14,22,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.16)}
    .btn .ic{font-size:1.15rem;line-height:1}
    .btn .lb{font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
    .progress-pill{position:fixed;top:18px;right:20px;z-index:5;pointer-events:none;min-width:0;padding:0;text-align:right;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase}
    @media (max-width:480px){.controls-bar .btn{width:52px;height:52px}.progress-pill{top:14px;right:14px}}
    .btn[hidden]{display:none!important}
    #loader{pointer-events:auto;cursor:pointer}
    #loader.done{pointer-events:none}
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="vignette"></div>
  <div id="loader"><span>♥ Tap to begin</span></div>

  <header class="hud-header">
    <div class="hud-title">Lilium Orientalis</div>
    <div class="hud-sub" id="phase-label">Phase I · Cellular Lattice</div>
  </header>

  <div class="controls-bar">
    <button class="btn" id="replay-btn" title="Replay Animation"><span class="ic">↻</span><span class="lb">Replay</span></button>
    <button class="btn active" id="rotate-btn" hidden title="Toggle Cinematic Camera"><span class="ic">🎬</span><span class="lb">Cinema</span></button>
    <button class="btn pulse-hint" id="sound-btn" hidden title="Heartbeat sound + vibration"><span class="ic">♥</span><span class="lb">Beat</span></button>
    <button class="btn" id="speed-btn" hidden title="Animation speed"><span class="ic" id="speed-ic">1×</span><span class="lb">Speed</span></button>
    <button class="btn" id="fs-btn" title="Fullscreen"><span class="ic">⛶</span><span class="lb">Full</span></button>
  </div>
  <span class="progress-pill" id="stage-status">Growing...</span>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

    /* ======================================================================
       1. PROCEDURAL TEXTURES & TEXT POINT SAMPLER
       ====================================================================== */

    function mulberry32(seed) {
      let a = seed >>> 0;
      return function () {
        a |= 0;
        a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function createPetalTextures() {
      const w = 512, h = 1024;
      const colorCanvas = document.createElement('canvas');
      colorCanvas.width = w;
      colorCanvas.height = h;
      const ctx = colorCanvas.getContext('2d');

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = w;
      bumpCanvas.height = h;
      const bctx = bumpCanvas.getContext('2d');

      // Realistic Stargazer Lily base: lime-chartreuse nectary throat -> soft blush -> pure porcelain white margins
      const baseGrad = ctx.createLinearGradient(0, h, 0, 0);
      baseGrad.addColorStop(0.0, '#9ec96b');  // botanical chartreuse throat base
      baseGrad.addColorStop(0.11, '#d8e3a8'); // pale pistachio transition
      baseGrad.addColorStop(0.24, '#f7d4e2'); // soft rose blush
      baseGrad.addColorStop(0.62, '#fff5f8'); // translucent porcelain white
      baseGrad.addColorStop(1.0, '#ffffff');  // crisp snow-white recurved tip
      ctx.fillStyle = baseGrad;
      ctx.fillRect(0, 0, w, h);

      // Rich crimson-magenta central flame band with soft organic feathering
      const stripeGrad = ctx.createRadialGradient(w * 0.5, h * 0.68, 10, w * 0.5, h * 0.58, w * 0.43);
      stripeGrad.addColorStop(0.0, 'rgba(176, 16, 78, 0.96)');
      stripeGrad.addColorStop(0.38, 'rgba(214, 46, 112, 0.84)');
      stripeGrad.addColorStop(0.68, 'rgba(238, 128, 170, 0.36)');
      stripeGrad.addColorStop(1.0, 'rgba(255, 255, 255, 0.0)');
      ctx.fillStyle = stripeGrad;
      ctx.fillRect(0, 0, w, h);

      // Subtle central emerald-gold nectary groove at very base
      const throatGrad = ctx.createRadialGradient(w * 0.5, h * 0.96, 4, w * 0.5, h * 0.9, w * 0.16);
      throatGrad.addColorStop(0.0, 'rgba(126, 178, 72, 0.85)');
      throatGrad.addColorStop(1.0, 'rgba(126, 178, 72, 0.0)');
      ctx.fillStyle = throatGrad;
      ctx.fillRect(0, 0, w, h);

      // Longitudinal botanical veins (color + bump)
      bctx.fillStyle = '#808080';
      bctx.fillRect(0, 0, w, h);

      for (let i = -18; i <= 18; i++) {
        const norm = i / 18;
        ctx.beginPath();
        bctx.beginPath();
        for (let y = 0; y <= h; y += 16) {
          const v = 1 - y / h;
          const envelope = Math.sin(Math.pow(v, 0.7) * Math.PI);
          const x = w * 0.5 + norm * (w * 0.42) * envelope;
          if (y === 0) {
            ctx.moveTo(x, y);
            bctx.moveTo(x, y);
          } else {
            ctx.lineTo(x, y);
            bctx.lineTo(x, y);
          }
        }
        ctx.strokeStyle = Math.abs(norm) < 0.35 ? 'rgba(175, 25, 85, 0.16)' : 'rgba(220, 170, 190, 0.14)';
        ctx.lineWidth = Math.abs(norm) < 0.06 ? 3.2 : 1.4;
        ctx.stroke();

        bctx.strokeStyle = Math.abs(norm) < 0.06 ? '#d8d8d8' : '#a4a4a4';
        bctx.lineWidth = Math.abs(norm) < 0.06 ? 4.0 : 1.8;
        bctx.stroke();
      }

      // Characteristic Stargazer dark crimson/magenta raised papillae spots
      const rand = mulberry32(9012);
      for (let i = 0; i < 165; i++) {
        const v = 0.16 + rand() * 0.56; // lower-to-mid throat
        const spread = (1 - Math.abs(v - 0.42) * 1.4) * 0.34;
        const u = 0.5 + (rand() - 0.5) * 2 * Math.max(0.05, spread);
        const px = u * w;
        const py = (1 - v) * h;
        const rx = 2.0 + rand() * 3.4;
        const ry = rx * (1.2 + rand() * 0.6);

        ctx.save();
        ctx.translate(px, py);
        ctx.rotate((rand() - 0.5) * 0.3);
        ctx.beginPath();
        ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
        ctx.fillStyle = rand() > 0.3 ? 'rgba(138, 12, 58, 0.88)' : 'rgba(175, 28, 82, 0.75)';
        ctx.fill();
        ctx.restore();

        bctx.beginPath();
        bctx.arc(px, py, rx * 1.15, 0, Math.PI * 2);
        bctx.fillStyle = '#ffffff';
        bctx.fill();
      }

      for (let i = 0; i < 260; i++) {
        const v = 0.1 + rand() * 0.62;
        const u = 0.5 + (rand() - 0.5) * (0.15 + 0.5 * Math.max(0, 1 - Math.abs(v - 0.4) * 1.4));
        ctx.beginPath();
        ctx.arc(u * w, (1 - v) * h, 0.8 + rand() * 1.6, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(120,10,55,${0.35 + rand() * 0.4})`;
        ctx.fill();
      }
      for (let i = 0; i < 90; i++) {
        ctx.fillStyle = `rgba(255,160,200,${0.02 + rand() * 0.04})`;
        ctx.beginPath();
        ctx.ellipse(rand() * w, rand() * h, 10 + rand() * 30, 18 + rand() * 50, rand() * 3, 0, Math.PI * 2);
        ctx.fill();
      }
      const petalColor = new THREE.CanvasTexture(colorCanvas);
      petalColor.colorSpace = THREE.SRGBColorSpace;
      petalColor.anisotropy = 4;

      const petalBump = new THREE.CanvasTexture(bumpCanvas);
      petalBump.anisotropy = 4;

      return { petalColor, petalBump };
    }

    function createBudAndLeafTextures() {
      // Bud texture (pale celadon green transitioning to blush-pink tip)
      const bCanvas = document.createElement('canvas');
      bCanvas.width = 256;
      bCanvas.height = 512;
      const bCtx = bCanvas.getContext('2d');
      const bGrad = bCtx.createLinearGradient(0, 512, 0, 0);
      bGrad.addColorStop(0.0, '#2d6a36');
      bGrad.addColorStop(0.45, '#7ab86b');
      bGrad.addColorStop(0.78, '#e3b5c4');
      bGrad.addColorStop(1.0, '#d96b92');
      bCtx.fillStyle = bGrad;
      bCtx.fillRect(0, 0, 256, 512);
      const budColor = new THREE.CanvasTexture(bCanvas);
      budColor.colorSpace = THREE.SRGBColorSpace;

      // Leaf texture (deep emerald green with lighter parallel venation)
      const lCanvas = document.createElement('canvas');
      lCanvas.width = 256;
      lCanvas.height = 512;
      const lCtx = lCanvas.getContext('2d');
      const lGrad = lCtx.createLinearGradient(0, 512, 0, 0);
      lGrad.addColorStop(0.0, '#133d1e');
      lGrad.addColorStop(0.55, '#226633');
      lGrad.addColorStop(1.0, '#3e8c49');
      lCtx.fillStyle = lGrad;
      lCtx.fillRect(0, 0, 256, 512);

      const lbCanvas = document.createElement('canvas');
      lbCanvas.width = 256;
      lbCanvas.height = 512;
      const lbCtx = lbCanvas.getContext('2d');
      lbCtx.fillStyle = '#808080';
      lbCtx.fillRect(0, 0, 256, 512);

      for (let i = -8; i <= 8; i++) {
        const x = 128 + i * 13;
        lCtx.strokeStyle = i === 0 ? 'rgba(145, 215, 140, 0.35)' : 'rgba(95, 175, 100, 0.16)';
        lCtx.lineWidth = i === 0 ? 3 : 1.2;
        lCtx.beginPath();
        lCtx.moveTo(128, 512);
        lCtx.quadraticCurveTo(x, 256, 128, 0);
        lCtx.stroke();

        lbCtx.strokeStyle = i === 0 ? '#d0d0d0' : '#9c9c9c';
        lbCtx.lineWidth = i === 0 ? 3.5 : 1.5;
        lbCtx.beginPath();
        lbCtx.moveTo(128, 512);
        lbCtx.quadraticCurveTo(x, 256, 128, 0);
        lbCtx.stroke();
      }

      const leafColor = new THREE.CanvasTexture(lCanvas);
      leafColor.colorSpace = THREE.SRGBColorSpace;
      const leafBump = new THREE.CanvasTexture(lbCanvas);

      // Soft glowing sprite for ambient dust
      const sCanvas = document.createElement('canvas');
      sCanvas.width = 64;
      sCanvas.height = 64;
      const sCtx = sCanvas.getContext('2d');
      const sGrad = sCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
      sGrad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
      sGrad.addColorStop(0.35, 'rgba(255, 220, 235, 0.65)');
      sGrad.addColorStop(1.0, 'rgba(255, 200, 225, 0.0)');
      sCtx.fillStyle = sGrad;
      sCtx.fillRect(0, 0, 64, 64);
      const softSprite = new THREE.CanvasTexture(sCanvas);

      return { budColor, leafColor, leafBump, softSprite };
    }

    function createLilyTextureSet() {
      return {
        ...createPetalTextures(),
        ...createBudAndLeafTextures()
      };
    }

    /* ======================================================================
       2. CUSTOM GLSL SHADERS (CLEAN UV-GRID TO SHADED BOTANICAL MESH)
       ====================================================================== */

    function applyStage(material, { grow = 1, shade = 1, grid = 1 }) {
      if (!material || !material.uniforms) return;
      if (material.uniforms.uGrow) material.uniforms.uGrow.value = grow;
      if (material.uniforms.uShade) material.uniforms.uShade.value = shade;
      if (material.uniforms.uGridAmount) material.uniforms.uGridAmount.value = grid;
    }

    const COMMON_GRID_GLSL = /* glsl */ `
      float computeGridLine(vec2 uv, vec2 density, float thickness) {
        vec2 g = uv * density;
        vec2 f = abs(fract(g - 0.5) - 0.5);
        vec2 fw = max(fwidth(g), vec2(0.0005));
        vec2 line = smoothstep(vec2(thickness), vec2(thickness) + fw * 1.35, f);
        return 1.0 - min(line.x, line.y);
      }
    `;

    const windTime = { value: 0 };
    const touchRayO = { value: new THREE.Vector3(0, -99, 0) };
    const touchRayD = { value: new THREE.Vector3(0, 0, -1) };
    const touchDisp = { value: new THREE.Vector3() };
    const WIND_K = 0; // wind sway removed
    const WIND_GLSL = /* glsl */ `
          uniform float uWindTime;
          uniform vec3 uRayO;
          uniform vec3 uRayD;
          uniform vec3 uTouchDisp;
          vec3 windOffset(vec3 wp) {
            float h = max(wp.y + 0.4, 0.0);
            float k = h * h * ${WIND_K.toFixed(4)} * (0.75 + 0.25 * sin(uWindTime * 0.37));
            vec3 w = vec3(
              (sin(uWindTime * 1.3 + wp.y * 0.9 + wp.z * 0.5) + 0.35 * sin(uWindTime * 2.7 + wp.y * 2.1) + 0.5 * sin(uWindTime * 0.31)) * k,
              0.0,
              cos(uWindTime * 1.1 + wp.y * 0.7 + wp.x * 0.4) * k * 0.7);
            float t = max(dot(wp - uRayO, uRayD), 0.0);
            vec3 d = wp - (uRayO + uRayD * t);
            float f = exp(-dot(d, d) / 0.7);
            float hb = clamp((wp.y + 0.4) / 3.0, 0.0, 1.0);
            return w + uTouchDisp * f * hb * hb;
          }
    `;
    function windJS(p, out, t) {
      const h = Math.max(p.y + 0.4, 0);
      const k = h * h * WIND_K * (0.75 + 0.25 * Math.sin(t * 0.37));
      return out.set(
        (Math.sin(t * 1.3 + p.y * 0.9 + p.z * 0.5) + 0.35 * Math.sin(t * 2.7 + p.y * 2.1) + 0.5 * Math.sin(t * 0.31)) * k,
        0,
        Math.cos(t * 1.1 + p.y * 0.7 + p.x * 0.4) * k * 0.7
      );
    }
    const _wv = new THREE.Vector3();

    function createStemMaterial({
      gridDensity = [24, 6],
      radius = 0.05,
      taper = 0.65,
      colorA = 0x1a5429,
      colorB = 0x5fae5a
    } = {}) {
      return new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: true,
        side: THREE.DoubleSide,
        uniforms: {
          uGrow: { value: 0 },
          uWindTime: windTime,
          uRayO: touchRayO,
          uRayD: touchRayD,
          uTouchDisp: touchDisp,
          uShade: { value: 0 },
          uGridAmount: { value: 1 },
          uGridDensity: { value: new THREE.Vector2(gridDensity[0], gridDensity[1]) },
          uTaper: { value: taper },
          uRadius: { value: radius },
          uColorA: { value: new THREE.Color(colorA) },
          uColorB: { value: new THREE.Color(colorB) },
          uGridColor: { value: new THREE.Color(0x7dffb3) },
          uLightDir: { value: new THREE.Vector3(0.5, 0.8, 0.6).normalize() }
        },
        vertexShader: /* glsl */ `
          ${WIND_GLSL}
          uniform float uTaper;
          uniform float uRadius;
          varying vec2 vUv;
          varying vec3 vNormalW;
          varying vec3 vViewDir;

          void main() {
            vUv = uv;
            float scaleTaper = mix(1.0, uTaper, pow(uv.x, 0.85));
            vec3 pos = position - normal * (uRadius * (1.0 - scaleTaper));
            vec4 worldPos = modelMatrix * vec4(pos, 1.0);
            worldPos.xyz += windOffset(worldPos.xyz);
            vNormalW = normalize(mat3(modelMatrix) * normal);
            vViewDir = normalize(cameraPosition - worldPos.xyz);
            gl_Position = projectionMatrix * viewMatrix * worldPos;
          }
        `,
        fragmentShader: /* glsl */ `
          uniform float uGrow;
          uniform float uShade;
          uniform float uGridAmount;
          uniform vec2 uGridDensity;
          uniform vec3 uColorA;
          uniform vec3 uColorB;
          uniform vec3 uGridColor;
          uniform vec3 uLightDir;

          varying vec2 vUv;
          varying vec3 vNormalW;
          varying vec3 vViewDir;

          ${COMMON_GRID_GLSL}

          void main() {
            float axis = vUv.x;
            if (axis > uGrow) discard;

            float edgeDist = uGrow - axis;
            float leadingPulse = smoothstep(0.09, 0.0, edgeDist) * step(0.001, uGrow);

            float grid = computeGridLine(vUv, uGridDensity, 0.055) * uGridAmount;
            float shadeMask = smoothstep(0.0, 0.28, uShade - axis * 0.22);

            vec3 n = normalize(vNormalW);
            float ndl = max(dot(n, uLightDir), 0.0) * 0.72 + 0.28;
            float fresnel = pow(1.0 - max(dot(n, normalize(vViewDir)), 0.0), 2.5);

            vec3 organic = mix(uColorA, uColorB, vUv.x) * ndl + uColorB * fresnel * 0.25;
            vec3 wireCol = uGridColor * (1.15 + leadingPulse * 1.4);

            float wireVisibility = max(grid * 0.95, 0.14);
            vec3 col = mix(wireCol * wireVisibility, organic, shadeMask);
            col += wireCol * grid * (1.0 - shadeMask * 0.82) * 0.85;
            col += uGridColor * leadingPulse * 0.75;

            float alpha = mix(max(grid, 0.18), 1.0, shadeMask);
            gl_FragColor = vec4(col, alpha);
          }
        `
      });
    }

    function createLeafMaterial({
      size = [0.1, 1.2],

        const mesh = new THREE.Mesh(geometry, material);
        mesh.frustumCulled = false;
        mesh.quaternion.setFromRotationMatrix(_m.makeBasis(xAxis, dir, zAxis));
        mesh.position.copy(base).addScaledVector(radial, 0.035);

        leaves.push({ mesh, material, start: 0.05 + t * 1.2 });
      }
      return leaves;
    }

    function createBloom(cfg, shared) {
      const { textures, petalGeometry, antherGeometry } = shared;
      const rand = mulberry32(cfg.seed);
      const isBud = !!cfg.isBud;
      const maxOpen = cfg.maxOpen ?? 1;
      let tl = cfg.timeline;
      if (cfg.attach !== null && cfg.attach !== undefined && cfg.pedicel) {
        const start = cfg.pedicel[1] * 0.55 + 0.01;
        const g0 = tl.grow[0], oEnd = Math.max(tl.open[1], tl.grow[1]);
        const k = (1 - start) / Math.max(oEnd - g0, 1e-3);
        const m = (t) => start + (t - g0) * k;
        tl = { grow: tl.grow.map(m), shade: tl.shade.map(m), open: tl.open.map(m) };
      }

      const root = new THREE.Group();
      root.position.fromArray(cfg.position);
      root.quaternion.setFromUnitVectors(UP, new THREE.Vector3().fromArray(cfg.axis).normalize());
      root.scale.setScalar(cfg.scale);

      const petalRoot = new THREE.Group();
      petalRoot.rotation.y = cfg.spin;
      root.add(petalRoot);

      const petals = [];
      for (let k = 0; k < 6; k++) {
        const inner = (k & 1) === 1;
        const material = createPetalMaterial({
          size: inner ? [0.3, 1.04] : [0.255, 1.08],
          seed: rand(),
          colorMap: isBud ? textures.budColor : textures.petalColor,
          bumpMap: textures.petalBump,
          recurve: inner ? 1.1 : 1.35,
          cup: 0.14,
          ruffle: inner ? 0.22 : 0.15,
          ruffleFreq: 16 + rand() * 6,
          translColor: isBud ? 0xcfe8a8 : 0xff9fb4,
          transl: isBud ? 0.35 : 0.55,
          gridDensity: [14, 28]
        });
        const mesh = new THREE.Mesh(petalGeometry, material);
        mesh.frustumCulled = false;
        petalRoot.add(mesh);

        petals.push({
          mesh,
          material,
          phi: (k * Math.PI) / 3 + (rand() - 0.5) * 0.08,
          stagger: inner ? 0.1 : 0,
          thetaClosed: inner ? 0.03 : 0.07,
          thetaOpen: (inner ? 1.2 : 1.36) + (rand() - 0.5) * 0.12,
          rbClosed: inner ? 0.12 : 0.18
        });
      }

      const stamens = [];
      let filamentMaterial = null;
      let antherMaterial = null;
      let pistil = null;
      let stigmaMaterial = null;

      if (!isBud) {
        const filamentCurve = new THREE.CatmullRomCurve3(
          [
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(0.01, 0.3, 0),
            new THREE.Vector3(0.05, 0.6, 0),
            new THREE.Vector3(0.12, 0.85, 0)
          ],
          false,
          'centripetal'
        );
        const filamentGeometry = new THREE.TubeGeometry(filamentCurve, 28, 0.011, 6, false);
        filamentMaterial = createStemMaterial({
          gridDensity: [14, 3],
          radius: 0.011,
          taper: 0.85,
          colorA: 0xcfd9a0,
          colorB: 0xf3efd0
        });
        antherMaterial = createSolidMaterial({
          color: 0xa63412,
          emissive: 0x3b1204,
          shininess: 36,
          specular: 0.42,
          appear: 0
        });
        const tip = filamentCurve.getPointAt(1);

        for (let k = 0; k < 6; k++) {
          const azimuth = new THREE.Group();
          azimuth.rotation.y = -(k * (Math.PI / 3) + Math.PI / 6);
          azimuth.scale.setScalar(0.9 + rand() * 0.12);
          const tilt = new THREE.Group();
          azimuth.add(tilt);

          const filament = new THREE.Mesh(filamentGeometry, filamentMaterial);
          tilt.add(filament);

          const anther = new THREE.Mesh(antherGeometry, antherMaterial);
          anther.position.copy(tip);
          anther.rotation.z = -1.25;
          anther.scale.set(0.034, 0.14, 0.034);
          tilt.add(anther);

          petalRoot.add(azimuth);
          stamens.push({ tilt });
        }

        const pistilCurve = new THREE.CatmullRomCurve3(
          [
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(0.004, 0.4, 0),
            new THREE.Vector3(0.02, 0.85, 0),
            new THREE.Vector3(0.07, 1.12, 0)
          ],
          false,
          'centripetal'
        );
        const pistilGeometry = new THREE.TubeGeometry(pistilCurve, 32, 0.014, 6, false);
        const pistilMaterial = createStemMaterial({
          gridDensity: [18, 3],
          radius: 0.014,
          taper: 0.9,
          colorA: 0xd8e8b0,
          colorB: 0xf6efe0
        });
        stigmaMaterial = createSolidMaterial({
          color: 0xe8a0b8,
          emissive: 0x2a0816,
          shininess: 50,
          specular: 0.4,
          appear: 0
        });
        const pistilGroup = new THREE.Group();
        pistilGroup.rotation.y = 0.4;
        const pistilTilt = new THREE.Group();
        pistilGroup.add(pistilTilt);
        pistilTilt.add(new THREE.Mesh(pistilGeometry, pistilMaterial));
        const stigma = new THREE.Mesh(antherGeometry, stigmaMaterial);
        stigma.position.copy(pistilCurve.getPointAt(1));
        stigma.scale.set(0.05, 0.045, 0.05);
        pistilTilt.add(stigma);
        petalRoot.add(pistilGroup);
        pistil = { tilt: pistilTilt, material: pistilMaterial };
      }

      function update(s2, time) {
        const grow = seg(s2, tl.grow[0], tl.grow[1]);
        const shade = seg(s2, tl.shade[0], tl.shade[1]);
        const open = seg(s2, tl.open[0], tl.open[1]) * maxOpen;
        root.scale.setScalar(cfg.scale * lerp(0.35, 1.0, ease(grow)));

        petalRoot.rotation.y = cfg.spin + Math.sin(time * 0.17 + cfg.seed) * 0.04;

        for (let i = 0; i < petals.length; i++) {
          const p = petals[i];
          const bp = clamp01((open - p.stagger) / Math.max(1 - p.stagger, 1e-3));
          const be = ease(bp);

          p.material.uniforms.uBloom.value = bp;
          applyStage(p.material, { grow, shade, grid: 1 });

          const theta = lerp(p.thetaClosed, p.thetaOpen, be);
          const c = Math.cos(theta);
          const s = Math.sin(theta);
          _r.set(Math.cos(p.phi), 0, Math.sin(p.phi));
          _y.set(0, c, 0).addScaledVector(_r, s);
          _z.set(0, s, 0).addScaledVector(_r, -c);
          _x.crossVectors(_y, _z);
          _m.makeBasis(_x, _y, _z);
          p.mesh.quaternion.setFromRotationMatrix(_m);
          p.mesh.position.copy(_r).multiplyScalar(p.rbClosed * (1 - ease(bp * 1.2)));
          p.mesh.scale.set(lerp(0.42, 1.0, ease(bp * 1.15)), 1, 1);
        }

        if (!isBud) {
          const sGrow = seg(open, 0.22, 0.7);
          const sShade = seg(open, 0.3, 0.85);
          const appear = seg(open, 0.4, 0.8);
          const spread = lerp(0.05, 0.5, ease(open));

          applyStage(filamentMaterial, { grow: sGrow, shade: sShade, grid: 1 });
          applyStage(pistil.material, { grow: sGrow, shade: sShade, grid: 1 });
          antherMaterial.uniforms.uAppear.value = appear;
          stigmaMaterial.uniforms.uAppear.value = appear;

          for (let i = 0; i < stamens.length; i++) stamens[i].tilt.rotation.z = -spread;
          pistil.tilt.rotation.z = -lerp(0.0, 0.18, ease(open));
        }
      }

      return { root, update };
    }

    function createLily(options = {}) {
      const { textures } = options;
      const group = new THREE.Group();
      group.name = 'StargazerLily';

      const petalGeometry = new THREE.PlaneGeometry(1, 1, 16, 40);
      const leafGeometry = new THREE.PlaneGeometry(1, 1, 8, 56);
      const antherGeometry = new THREE.SphereGeometry(1, 16, 12);
      const shared = { textures, petalGeometry, antherGeometry };

      const stem = makeTube(
        STEM_POINTS.map((p) => new THREE.Vector3(p[0], p[1], p[2])),
        0.055,
        { taper: 0.62, colorA: 0x1a5429, colorB: 0x5fae5a },
        260,
        0.042
      );
      group.add(stem.mesh);

      const leaves = buildLeaves(stem, textures, leafGeometry);
      leaves.forEach((l) => group.add(l.mesh));

      const pedicels = [];
      const blooms = [];

      const addBloom = (cfg) => {
        if (cfg.attach !== null && cfg.attach !== undefined) {
          const p0 = stem.curve.getPointAt(cfg.attach);
          const end = new THREE.Vector3().fromArray(cfg.position);
          const axis = new THREE.Vector3().fromArray(cfg.axis).normalize();
          const pts = [p0];
          if (cfg.via) {
            cfg.via.forEach((v) => pts.push(new THREE.Vector3().fromArray(v)));
          } else {
            pts.push(p0.clone().lerp(end, 0.35).add(new THREE.Vector3(0, 0.2, 0)));
          }
          pts.push(end.clone().addScaledVector(axis, -0.45));
          pts.push(end.clone());
          const ped = makeTube(pts, 0.026, { taper: 0.8, colorA: 0x1d5a2e, colorB: 0x4f9e52 }, 64, 0.036);
          group.add(ped.mesh);
          pedicels.push({ material: ped.material, window: (cfg.pedicel || [0, 0.2]).map((v) => v * 0.55) });
        }
        const bloom = createBloom(cfg, shared);
        group.add(bloom.root);
        blooms.push(bloom);
      };

      BLOOMS.forEach(addBloom);
      BUDS.forEach(addBloom);

      const anchors = BLOOMS.map((b) => new THREE.Vector3().fromArray(b.position));

      function update(progress, time) {
        const s1 = progress / STAGE.growthEnd;
        const s2 = (progress - STAGE.growthEnd) / (STAGE.bloomEnd - STAGE.growthEnd);

        applyStage(stem.material, { grow: seg(s1, 0, 0.85), shade: seg(s1, 0.12, 1.07), grid: 1 });

        for (let i = 0; i < leaves.length; i++) {
          const l = leaves[i];
          applyStage(l.material, {
            grow: seg(s1, l.start, l.start + 0.42),
            shade: seg(s1, l.start + 0.1, l.start + 0.7),
            grid: 1
          });
        }

        for (let i = 0; i < pedicels.length; i++) {
          const p = pedicels[i];
          applyStage(p.material, {
            grow: seg(s2, p.window[0], p.window[1]),
            shade: seg(s2, p.window[0] + 0.08, p.window[1] + 0.3),
            grid: 1
          });
        }

        for (let i = 0; i < blooms.length; i++) blooms[i].update(s2, time);

        group.rotation.z = Math.sin(time * 0.23) * 0.012;
      }

      update(0, 0);
      return { group, update, anchors, stemCurve: stem.curve };
    }

    /* ======================================================================
       4. 3D HEART PARTICLE TEXT MORPHING ENGINE (MESSAGE + FINALE "J+R")
       ====================================================================== */

    const easeInOutCubic = (t) => {
      const x = clamp01(t);
      return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    };

    function buildHeartGeometry() {
      const shape = new THREE.Shape();
      const steps = 18;
      for (let i = 0; i <= steps; i++) {
        const t = (i / steps) * Math.PI * 2;
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y =
          13 * Math.cos(t) -
          5 * Math.cos(2 * t) -
          2 * Math.cos(3 * t) -
          Math.cos(4 * t);
        if (i === 0) shape.moveTo(x * 0.055, y * 0.055);
        else shape.lineTo(x * 0.055, y * 0.055);
      }

      const geo = new THREE.ExtrudeGeometry(shape, {
        depth: 0.24,
        bevelEnabled: true,
        bevelSegments: 1,
        steps: 1,
        bevelSize: 0.08,
        bevelThickness: 0.08
      });

      geo.center();
      geo.computeVertexNormals();
      return geo;
    }

    function sampleMessageAndMonogramPoints({
      lines = ['Jasin Loves You Most', 'Forever Yours...'],
      monogram = 'J+R',
      maxPoints = 1650
    } = {}) {
      const rand = mulberry32(4242);

      function sampleFromCanvas(drawFn, targetCount, metaFn, stepSize = 3) {
        const cw = 1400;
        const ch = 520;
        const canvas = document.createElement('canvas');
        canvas.width = cw;
        canvas.height = ch;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, cw, ch);
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        drawFn(ctx, cw, ch);

        const img = ctx.getImageData(0, 0, cw, ch).data;
        const candidates = [];

        for (let y = 0; y < ch; y += stepSize) {
          for (let x = 0; x < cw; x += stepSize) {
            const idx = (y * cw + x) * 4;
            const lum = img[idx];
            if (lum > 95) {
              const nx = (x / cw) * 2 - 1;
              const ny = -((y / ch) * 2 - 1);
              candidates.push({
                x: nx,
                y: ny,
                weight: lum / 255,
                ...metaFn(nx, ny, x, y, cw, ch)
              });
            }
          }
        }

        for (let i = candidates.length - 1; i > 0; i--) {
          const j = Math.floor(rand() * (i + 1));
          const tmp = candidates[i];
          candidates[i] = candidates[j];
          candidates[j] = tmp;
        }

        return candidates.slice(0, Math.min(targetCount, candidates.length));
      }

      const mainCount = Math.floor(maxPoints * 0.72);
      const monoCount = maxPoints - mainCount;

      const mainPoints = sampleFromCanvas(
        (ctx, cw, ch) => {
          const fit = (txt, px, maxW) => {
            ctx.font = `italic 700 ${px}px "Cormorant Garamond", Georgia, serif`;
            const w = ctx.measureText(txt).width;
            if (w > maxW) {
              px = Math.floor((px * maxW) / w);
              ctx.font = `italic 700 ${px}px "Cormorant Garamond", Georgia, serif`;
            }
            return px;
          };
          ctx.lineJoin = 'round';
          ctx.strokeStyle = '#ffffff';
          let px0 = fit(lines[0], 200, cw * 0.95);
          ctx.lineWidth = Math.max(6, px0 * 0.06);
          ctx.strokeText(lines[0], cw * 0.5, ch * 0.31);
          ctx.fillText(lines[0], cw * 0.5, ch * 0.31);
          px0 = fit(lines[1], 170, cw * 0.82);
          ctx.lineWidth = Math.max(6, px0 * 0.06);
          ctx.strokeText(lines[1], cw * 0.5, ch * 0.72);
          ctx.fillText(lines[1], cw * 0.5, ch * 0.72);
        },
        mainCount,
        (_nx, _ny, _x, y, _cw, ch) => ({
          line: y < ch * 0.52 ? 0 : 1
        }),
        2
      );

      const monoPoints = sampleFromCanvas(
        (ctx, cw, ch) => {
          ctx.lineJoin = 'round';
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 5;
          ctx.font = 'italic 700 160px "Cormorant Garamond", Georgia, serif';
          ctx.strokeText(monogram, cw * 0.5, ch * 0.52);
          ctx.fillText(monogram, cw * 0.5, ch * 0.52);
        },
        monoCount,
        (nx) => ({
          line: 2,
          isPlus: Math.abs(nx) < 0.11
        }),
        2
      );

      const ringHearts = 360;
      for (let i = 0; i < ringHearts; i++) {
        const a = (i / ringHearts) * Math.PI * 2;
        monoPoints.push({
          x: Math.cos(a) * 0.62,
          y: Math.sin(a) * 0.68,
          weight: 1.0,
          line: 2,
          isRing: true,
          ringAngle: a
        });
      }

      return { mainPoints, monoPoints };
    }

    function createHeartText({ mainPoints, monoPoints, textures, origins = [] }) {
      const group = new THREE.Group();
      group.name = 'HeartParticleText';

      const rand = mulberry32(2026);
      const count = Math.max(mainPoints.length, monoPoints.length);

      const textWidth = 5.1;
      const textHeight = 1.85;
      const centerY = -1.42;
      const centerZ = 0.68;

      const monoScaleX = 5.0;
      const monoScaleY = 1.85;
      const monoCenterY = -1.0;
      const HEART_SX = 0.108;
      const HEART_SY = (window.innerWidth / Math.max(window.innerHeight, 1)) < 0.85 ? 0.17 : 0.12;

      const heartGeo = buildHeartGeometry();
      const heartMat = new THREE.MeshStandardMaterial({
        color: 0xffc2d4,
        emissive: 0xff3b7f,
        emissiveIntensity: 0.92,
        roughness: 0.24,
        metalness: 0.12,
        toneMapped: true
      });

      const instancedHearts = new THREE.InstancedMesh(heartGeo, heartMat, count);
      instancedHearts.frustumCulled = false;
      instancedHearts.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      group.add(instancedHearts);

      const palette = [
        new THREE.Color(0xff4d88),
        new THREE.Color(0xff85a8),
        new THREE.Color(0xffd6e5),
        new THREE.Color(0xf72585),
        new THREE.Color(0xfff5f8)
      ];

      const mainTargets = new Float32Array(count * 3);
      const monoTargets = new Float32Array(count * 3);
      const starts = new Float32Array(count * 3);
      const swirlParams = new Float32Array(count * 4);
      const baseScales = new Float32Array(count);
      const monoScales = new Float32Array(count);
      const isRingFlags = new Float32Array(count);
      const ringAngles = new Float32Array(count);

      const colorTmp = new THREE.Color();

      for (let i = 0; i < count; i++) {
        const mp = mainPoints[i % mainPoints.length];
        const jrp = monoPoints[i % monoPoints.length];
        const i3 = i * 3;
        const i4 = i * 4;

        mainTargets[i3] = mp.x * (textWidth * 0.5);
        mainTargets[i3 + 1] = centerY + mp.y * (textHeight * 0.5);
        mainTargets[i3 + 2] = centerZ + (rand() - 0.5) * 0.1;

        monoTargets[i3] = jrp.x * (monoScaleX * 0.5);
        monoTargets[i3 + 1] = monoCenterY + jrp.y * (monoScaleY * 0.5);
        monoTargets[i3 + 2] = centerZ + (jrp.isRing ? 0.18 : 0.04) + (rand() - 0.5) * 0.08;

        const origin = origins[i % origins.length];
        starts[i3] = origin.x + (rand() - 0.5) * 0.55;
        starts[i3 + 1] = origin.y + (rand() - 0.5) * 0.55;
        starts[i3 + 2] = origin.z + (rand() - 0.5) * 0.55;

        swirlParams[i4] = 0.35 + rand() * 1.1;
        swirlParams[i4 + 1] = (rand() > 0.5 ? 1 : -1) * (1.5 + rand() * 2.0);
        swirlParams[i4 + 2] = rand() * Math.PI * 2;
        const lineBias = mp.line === 0 ? 0.0 : 0.14;
        swirlParams[i4 + 3] = clamp01(lineBias + rand() * 0.25);

        baseScales[i] = lerp(0.019, 0.027, rand()) * lerp(0.9, 1.12, mp.weight ?? 1);
        monoScales[i] = jrp.isRing
          ? lerp(0.02, 0.027, rand())
          : lerp(0.021, 0.03, rand()) * lerp(0.92, 1.15, jrp.weight ?? 1);

        isRingFlags[i] = jrp.isRing ? 1.0 : 0.0;
        ringAngles[i] = jrp.ringAngle ?? 0.0;

        colorTmp.copy(palette[Math.floor(rand() * palette.length)]);
        instancedHearts.setColorAt(i, colorTmp);
      }

      if (instancedHearts.instanceColor) {
        instancedHearts.instanceColor.needsUpdate = true;
      }

      const dustCount = 280;
      const dustPositions = new Float32Array(dustCount * 3);
      const dustSeeds = new Float32Array(dustCount * 3);
      for (let i = 0; i < dustCount; i++) {
        dustPositions[i * 3] = (rand() - 0.5) * 9.5;
        dustPositions[i * 3 + 1] = lerp(-3.2, 5.4, rand());
        dustPositions[i * 3 + 2] = (rand() - 0.5) * 6.8;

        dustSeeds[i * 3] = rand() * Math.PI * 2;
        dustSeeds[i * 3 + 1] = 0.2 + rand() * 0.5;
        dustSeeds[i * 3 + 2] = 0.08 + rand() * 0.18;
      }

      const dustGeo = new THREE.BufferGeometry();
      dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
      const dustMat = new THREE.PointsMaterial({
        size: 0.055,
        map: textures.softSprite,
        color: 0xffd6e7,
        transparent: true,
        opacity: 0.3,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      const dustPoints = new THREE.Points(dustGeo, dustMat);
      group.add(dustPoints);

      const pointerWorld = new THREE.Vector3(999, 999, centerZ);
      let pointerActive = false;

      function setPointer(worldX, worldY, active = true) {
        pointerWorld.set(worldX, worldY, centerZ);
        pointerActive = active;
      }

      let tick = 0, primed = false;
      const dummy = new THREE.Object3D();

      function update(progress, time) {
        const msgStart = STAGE.bloomEnd - 0.10;
        const msgEnd = 0.72;
        const rawMsg = (progress - msgStart) / Math.max(msgEnd - msgStart, 0.001);

        const jrStart = 0.87;
        const jrEnd = 0.99;
        const jrBlend = easeInOutCubic((progress - jrStart) / Math.max(jrEnd - jrStart, 0.001));

        const stride = primed && count > 3500 ? 2 : 1;
        tick++;
        for (let i = tick % stride; i < count; i += stride) {
          const i3 = i * 3;
          const i4 = i * 4;

          const delay = swirlParams[i4 + 3];
          const localT = clamp01((rawMsg - delay) / Math.max(1.0 - delay, 0.001));
          const morph = easeInOutCubic(localT);

          const appearScale = clamp01(localT * 4.5);
          if (appearScale <= 0.0001) {
            dummy.position.set(0, -999, 0);
            dummy.scale.setScalar(0.0001);
            dummy.updateMatrix();
            instancedHearts.setMatrixAt(i, dummy.matrix);
            continue;
          }

          const sx = starts[i3];
          const sy = starts[i3 + 1];
          const sz = starts[i3 + 2];

          const m1x = lerp(sx, mainTargets[i3], morph);
          const m1y = lerp(sy, mainTargets[i3 + 1], morph);
          const m1z = lerp(sz, mainTargets[i3 + 2], morph);

          const jrArc = Math.sin(jrBlend * Math.PI);
          const phase = swirlParams[i4 + 2];
          const swirlAngle = phase + jrArc * 5.2 * (swirlParams[i4 + 1] > 0 ? 1 : -1);
          const swirlRad = jrArc * (0.28 + (swirlParams[i4] * 0.35));

          let tx = m1x;
          let ty = m1y;
          let tz = m1z;

          if (isRingFlags[i] > 0.5) {
            const rotA = ringAngles[i] + time * 0.45 * jrBlend;
            const shA = Math.sin(rotA);
            const hxx = 16 * shA * shA * shA;
            const hyy = 13 * Math.cos(rotA) - 5 * Math.cos(2 * rotA) - 2 * Math.cos(3 * rotA) - Math.cos(4 * rotA);
            const jrx = hxx * HEART_SX;
            const jry = monoCenterY + (hyy - 4) * HEART_SY;
            const jrz = monoTargets[i3 + 2];
            tx = lerp(m1x, jrx, jrBlend);

        }
        posAttr.needsUpdate = true;
      }

      update(0, 0);
      primed = true;
      return { group, update, setPointer };
    }

      }
      function pulse() {
        if (!on || document.hidden) return 0;
        const p = pos();
        let best = 1e9, idx = 0;
        for (let i = 0; i < BEAT_TIMES.length; i++) {
          let d = p - BEAT_TIMES[i]; if (d < 0) d += LOOP_DUR;
          if (d < best) { best = d; idx = i; }
        }
        return (idx % 2 === 0 ? 1 : 0.7) * Math.exp(-best * 9);
      }
      function hide() {
        clearTimeout(tmr); tmr = 0;
        clearInterval(synthTmr); synthTmr = 0;
        if (synthBus) { synthBus.disconnect(); synthBus = null; }
        if (vibOK) { try { navigator.vibrate(0); } catch (_) {} }
        if (src) { try { src.stop(); } catch (_) {} src.disconnect(); src = null; }
        if (ctx && ctx.state === 'running') ctx.suspend();
      }
      function show() {
        if (!on) return;
        if (ctx) ctx.resume().then(playSrc).catch(() => {});
        scheduleVib();
      }
      setInterval(() => {
        if (!on || document.hidden) return;
        if (ctx && ctx.state !== 'running') ctx.resume().catch(() => {}); else playSrc();
        if (!tmr) scheduleVib();
      }, 1000);
      return { start, arm, pulse, hide, show, toggle: async () => on, get on() { return on; }, get running() { return !!ctx && ctx.state === 'running'; }, get noAudio() { return !(window.AudioContext || window.webkitAudioContext); } };
    })();
    document.addEventListener('visibilitychange', () => { document.hidden ? heartbeat.hide() : heartbeat.show(); });
    window.addEventListener('pagehide', () => heartbeat.hide());

    const container = document.getElementById('canvas-container');
    const phaseLabel = document.getElementById('phase-label');
    const stageStatus = document.getElementById('stage-status');
    const replayBtn = document.getElementById('replay-btn');
    const rotateBtn = document.getElementById('rotate-btn');

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance',
      alpha: false
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020205);
    scene.fog = new THREE.FogExp2(0x020205, 0.048);

    const camera = new THREE.PerspectiveCamera(
      42,
      window.innerWidth / Math.max(window.innerHeight, 1),
      0.1,
      100
    );

    function getIdealCameraDistance() {
      const aspect = window.innerWidth / Math.max(window.innerHeight, 1);
      const vFov = THREE.MathUtils.degToRad(camera.fov);
      const halfHeightWorld = 3.55;
      const halfWidthWorld = 2.85;
      const distV = halfHeightWorld / Math.tan(vFov * 0.5);
      const distH = halfWidthWorld / (Math.tan(vFov * 0.5) * Math.max(aspect, 0.35));
      return Math.max(distV, distH) * 1.08;
    }

    camera.position.set(0.35, 0.92, getIdealCameraDistance());

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.82, 0.25);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.enablePan = false;
    controls.minDistance = 3.6;
    controls.maxDistance = 18.0;

    let userInteracting = false;
    let manualOverrideTimer = 0;
    let cinemaCamEnabled = true;

    controls.addEventListener('start', () => {
      userInteracting = true;
      manualOverrideTimer = 4.0; // Pause auto-choreography briefly after manual drag
    });
    controls.addEventListener('end', () => {
      userInteracting = false;
    });

    const hemiLight = new THREE.HemisphereLight(0xffeef6, 0x0a1a12, 0.85);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xfff5fa, 2.2);
    keyLight.position.set(3.2, 5.5, 4.5);
    scene.add(keyLight);
    const fillLight = new THREE.PointLight(0x52d681, 0.95, 12);
    fillLight.position.set(-1.5, 0.4, 2.5);
    scene.add(fillLight);

    // Back-side fill light so 360-degree rear flowers look equally lush and luminous
    const backFillLight = new THREE.PointLight(0xffb6d2, 1.15, 14);
    backFillLight.position.set(0.5, 2.6, -3.4);
    scene.add(backFillLight);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.56,
      0.65,
      0.72
    );
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());
    composer.renderTarget1.samples = 4;
    composer.renderTarget2.samples = 4;
    const gradePass = new ShaderPass({
      uniforms: { tDiffuse: { value: null }, uTime: { value: 0 } },
      vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader: `
        uniform sampler2D tDiffuse; uniform float uTime; varying vec2 vUv;
        float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
        void main(){
          vec3 c = texture2D(tDiffuse, vUv).rgb;
          float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
          c = mix(c * vec3(0.96, 0.98, 1.06), c * vec3(1.05, 1.0, 0.97), smoothstep(0.1, 0.7, l));
          c = mix(vec3(l), c, 1.08);
          c += (hash(vUv * vec2(1920.0, 1080.0) + uTime) - 0.5) * 0.016;
          gl_FragColor = vec4(max(c, 0.0), 1.0);
        }`
    });
    composer.addPass(gradePass);

    async function init() {
      if (document.fonts && document.fonts.ready) {
        try {
          await Promise.race([
            document.fonts.ready,
            new Promise((r) => setTimeout(r, 900))
          ]);
        } catch (_) {}
      }

      const textures = createLilyTextureSet();
      const lily = createLily({ textures });
      lily.group.position.set(0, 0.35, 0);
      scene.add(lily.group);

      const { mainPoints, monoPoints } = sampleMessageAndMonogramPoints({
        lines: ['Jasin Loves You Most', 'Forever Yours...'],
        monogram: 'Jasin + Rafia',
        maxPoints: 7000
      });

      const worldOrigins = lily.anchors.map((a) => a.clone().add(lily.group.position));

      const heartText = createHeartText({
        mainPoints,
        monoPoints,
        textures,
        origins: worldOrigins
      });
      scene.add(heartText.group);
      const petalFall = createTinyFlowers(scene);
      const butterflies = createButterflies(scene, worldOrigins, lily.stemCurve, lily.group.position);
      const soundBtn = document.getElementById('sound-btn');
      const speedBtn = document.getElementById('speed-btn');
      const fsBtn = document.getElementById('fs-btn');
      let speedMul = 1;
      let entered = false;
      const loaderEl = document.getElementById('loader');
      const enter = () => { if (entered) return; entered = true; loaderEl.classList.add('done'); };
      ['pointerup', 'click', 'touchend'].forEach((e) => loaderEl.addEventListener(e, enter));
      soundBtn.addEventListener('click', async () => {
        const on = await heartbeat.toggle();
        soundBtn.classList.toggle('active', on);
        soundBtn.classList.remove('pulse-hint');
      });
      speedBtn.addEventListener('click', () => {
        speedMul = speedMul === 1 ? 1.5 : speedMul === 1.5 ? 0.6 : 1;
        document.getElementById('speed-ic').textContent = speedMul + '×';
      });
      const fsEl = document.documentElement;
      if (!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen)) fsBtn.style.display = 'none';
      fsBtn.addEventListener('click', () => {
        try {
          if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
          else (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl);
        } catch (_) {}
      });

      const raycaster = new THREE.Raycaster();
      const pointerNDC = new THREE.Vector2();
      const textPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -0.68);
      const hitPoint = new THREE.Vector3();
      const bendX = new THREE.Vector3(), bendV = new THREE.Vector3();
      const _bR = new THREE.Vector3(), _bU = new THREE.Vector3(), _bZ = new THREE.Vector3(), _bImp = new THREE.Vector3(), _bC = new THREE.Vector3(0, 1.8, 0.35);
      let lastNX = null, lastNY = 0;
      function bendFromPointer(poke) {
        touchRayO.value.copy(raycaster.ray.origin);
        touchRayD.value.copy(raycaster.ray.direction);
        if (raycaster.ray.distanceToPoint(_bC) > 2.4) { lastNX = null; return; }
        if (poke) bendV.addScaledVector(raycaster.ray.direction, 1.6);
        else if (lastNX !== null) {
          camera.matrixWorld.extractBasis(_bR, _bU, _bZ);
          _bImp.copy(_bR).multiplyScalar(pointerNDC.x - lastNX).addScaledVector(_bU, (pointerNDC.y - lastNY) * 0.6).multiplyScalar(16);
          bendV.add(_bImp);
        }
        lastNX = pointerNDC.x; lastNY = pointerNDC.y;
      }

      function onPointerMove(event) {
        const clientX = event.touches ? event.touches[0].clientX : event.clientX;
        const clientY = event.touches ? event.touches[0].clientY : event.clientY;
        pointerNDC.x = (clientX / window.innerWidth) * 2 - 1;
        pointerNDC.y = -(clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointerNDC, camera);
        bendFromPointer(false);
        if (raycaster.ray.intersectPlane(textPlane, hitPoint)) {
          heartText.setPointer(hitPoint.x, hitPoint.y, true);
        }
      }

      window.addEventListener('pointermove', onPointerMove, { passive: true });
      window.addEventListener('pointerleave', () => heartText.setPointer(999, 999, false), { passive: true });
      window.addEventListener('pointerdown', (e) => {
        pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
        pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointerNDC, camera);
        lastNX = null;
        bendFromPointer(true);
      }, { passive: true });
      const endTouch = () => { lastNX = null; heartText.setPointer(999, 999, false); };
      window.addEventListener('pointerup', endTouch, { passive: true });
      window.addEventListener('pointercancel', endTouch, { passive: true });

      const DURATION = 32.0;
      let elapsed = 0;

      replayBtn.addEventListener('click', () => {
        elapsed = 0;
        manualOverrideTimer = 0;
      });

      rotateBtn.addEventListener('click', () => {
        cinemaCamEnabled = !cinemaCamEnabled;
        manualOverrideTimer = 0;
        rotateBtn.classList.toggle('active', cinemaCamEnabled);
      });

      window.addEventListener('resize', () => {
        const w = window.innerWidth;
        const h = Math.max(window.innerHeight, 1);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        composer.setSize(w, h);
        bloomPass.setSize(w, h);
      });

      const clock = new THREE.Clock();
      const desiredCamPos = new THREE.Vector3();
      const desiredTarget = new THREE.Vector3();

      /**
       * Computes a creative, continuous 360-degree camera choreography:
       * 1. Stage I (0 -> 0.30): Starts at the root base and spirals 360° upward following the growing stem.
       * 2. Stage II (0.30 -> 0.68): Full 360° ascending orbit around the 12 3D Stargazer Lilies as they bloom.
       * 3. Stage IIIa (0.68 -> 0.79): Close-up sweeping glide from left to right across "Jasin Loves You Most / Forever Yours...".
       * 4. Stage IIIb (0.79 -> 0.87): Smooth pull-back into a full-screen hero framing of both bouquet and text.
       * 5. Finale (0.87 -> 1.00+): Morphs into "J+R" and continues a graceful 360° orbit around the entire scene.
       */
      function updateCinematicCamera(progress, totalTime, dt) {
        if (!cinemaCamEnabled || userInteracting) return;
        if (manualOverrideTimer > 0) {
          manualOverrideTimer = Math.max(0, manualOverrideTimer - dt);
          return;
        }

        const baseDist = getIdealCameraDistance();

        if (progress < STAGE.growthEnd) {
          // Stage I: Start low at the stem base and spiral 360° upward following the growing tip
          const t1 = ease(progress / STAGE.growthEnd);
          const tipPoint = lily.stemCurve.getPointAt(clamp01(t1 * 0.94)).add(lily.group.position);

          const az = t1 * Math.PI * 2.0; // Full 360° spiral around the stem
          const dist = baseDist * lerp(0.68, 0.78, t1);
          const camY = lerp(0.15, 2.55, t1);

          desiredCamPos.set(
            Math.sin(az) * dist,
            camY,
            Math.cos(az) * dist
          );
          desiredTarget.set(
            tipPoint.x * 0.4,
            lerp(0.35, 2.45, t1),
            tipPoint.z * 0.4
          );
        } else if (progress < STAGE.bloomEnd) {
          // Stage II: Full 360° ascending showcase orbit around the 12 3D Stargazer Lilies
          const t2 = (progress - STAGE.growthEnd) / (STAGE.bloomEnd - STAGE.growthEnd);
          const smoothT2 = ease(t2);

          const az = Math.PI * 2.0 + smoothT2 * Math.PI * 2.0; // Second full 360° orbit during blooming
          const zoomPulse = 1.0 - Math.sin(smoothT2 * Math.PI) * 0.24;
          const dist = baseDist * zoomPulse * 0.86;
          const camY = lerp(2.25, 3.05, smoothT2) + Math.sin(smoothT2 * Math.PI * 2.0) * 0.35;

          desiredCamPos.set(
            Math.sin(az) * dist,
            camY,
            Math.cos(az) * dist
          );
          desiredTarget.set(
            0,
            lerp(2.1, 2.55, smoothT2),
            0
          );
        } else if (progress < 0.79) {
          // Stage IIIa: Close-up sweeping pass across "Jasin Loves You Most / Forever Yours..."
          const tClose = seg(progress, STAGE.bloomEnd, 0.79);
          const sweepX = lerp(-1.55, 1.55, tClose);
          const closeDist = baseDist * 0.56;

          desiredCamPos.set(
            sweepX * 0.85,
            -1.15 + Math.sin(tClose * Math.PI) * 0.18,
            0.68 + closeDist
          );
          desiredTarget.set(
            sweepX,
            -1.42,
            0.68
          );
        } else if (progress < 0.87) {
          // Stage IIIb: Glide back to full-screen hero framing showing both the 3D bouquet & full text
          const tFull = seg(progress, 0.79, 0.85);
          const sweepX = lerp(1.55, 0.0, tFull);
          const closeDist = baseDist * 0.56;

          desiredCamPos.set(
            sweepX * 0.85,
            lerp(-1.15, 0.92, tFull),
            lerp(0.68 + closeDist, baseDist, tFull)
          );
          desiredTarget.set(
            sweepX,
            lerp(-1.42, 0.82, tFull),
            lerp(0.68, 0.28, tFull)
          );
        } else {
          // Finale: Morph into "J+R" and orbit continuously 360° around the entire bouquet & emblem
          const tf = seg(progress, 0.87, 0.94);
          const orbitTime = Math.max(0, totalTime - DURATION * 0.88);
          const az = orbitTime * 0.38 * tf;
          const dist = baseDist * lerp(1.0, 0.96, tf);

          desiredCamPos.set(
            Math.sin(az) * dist,
            0.95 + Math.sin(orbitTime * 0.45) * 0.28 * tf,
            Math.cos(az) * dist
          );
          desiredTarget.set(0, 0.82, 0.28);
        }

        const followSpeed = 1.0 - Math.exp(-dt * 2.8);
        camera.position.lerp(desiredCamPos, followSpeed);
        controls.target.lerp(desiredTarget, followSpeed * 1.2);
      }

      function animate() {
        requestAnimationFrame(animate);

        const dt = Math.min(clock.getDelta(), 0.05);
        const totalTime = clock.elapsedTime;
        if (!entered && (heartbeat.running || heartbeat.noAudio)) enter();
        if (entered) elapsed += dt * speedMul;

        const progress = Math.min(elapsed / DURATION, 1.0);
        const pct = Math.round(progress * 100);

        if (progress < STAGE.growthEnd) {
          phaseLabel.textContent = 'Phase I · Cellular Lattice';
          stageStatus.textContent = `Stem ${pct}%`;
        } else if (progress < STAGE.bloomEnd) {
          phaseLabel.textContent = 'Phase II · Petal Morphogenesis';
          stageStatus.textContent = `Blooming ${pct}%`;
        } else if (progress < 0.87) {
          phaseLabel.textContent = 'Phase III · Heart Constellation';
          stageStatus.textContent = `Jasin ♥ ${pct}%`;
        } else if (progress < 0.99) {
          phaseLabel.textContent = 'Finale · Jasin + Rafia in Hearts';
          stageStatus.textContent = `Jasin + Rafia ${pct}%`;
        } else {
          phaseLabel.textContent = 'Forever · Jasin + Rafia';
          stageStatus.textContent = 'Jasin + Rafia ♥';
        }

        updateCinematicCamera(progress, totalTime, dt);

        const beat = heartbeat.pulse();
        bloomPass.strength = 0.56 + beat * 0.16;
        keyLight.intensity = 2.2 + beat * 0.45;
        gradePass.uniforms.uTime.value = totalTime % 100;
        windTime.value = totalTime;
        bendV.addScaledVector(bendX, -16 * dt).addScaledVector(bendV, -2.6 * dt);
        bendX.addScaledVector(bendV, dt).clampLength(0, 0.7);
        touchDisp.value.set(0, 0, 0); // touch bending removed
        butterflies.update(dt * speedMul, totalTime, clamp01((progress - 0.46) / 0.08));
        petalFall.update(dt * speedMul, totalTime, clamp01((progress - 0.56) / 0.08));
        lily.update(progress, totalTime);
        heartText.update(progress, totalTime);

        controls.update();
        composer.render();
      }

      heartbeat.arm();
      animate();
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
